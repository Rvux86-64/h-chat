<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/Chaticon.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="h-chat: A chat website made in html using supabase and github." />
    <title>h-chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    
    <style>
        :root {
          --bg-main: #09090b;
          --panel-bg: #121215;
          --sidebar-bg: #16161a;
          --panel-border: rgba(255, 255, 255, 0.08);
          --accent: #10b981;
          --accent-hover: #059669;
          --border-color: rgba(255, 255, 255, 0.08);
          --text-main: #f4f4f5;
          --text-muted: #71717a;
          --msg-self: #10b981;
          --msg-other: #18181b;
          --glass-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
          --radius-lg: 14px;
          --radius-md: 8px;
          --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        } 

        body.theme-ocean {
          --bg-main: #080d1a;
          --panel-bg: #0f172a;
          --sidebar-bg: #131d33;
          --accent: #0ea5e9;
          --accent-hover: #0284c7;
          --border-color: rgba(255, 255, 255, 0.09);
          --text-main: #f8fafc;
          --text-muted: #64748b;
          --msg-self: #0ea5e9;
          --msg-other: #1e293b;
        }

        body.theme-hacker {
          --bg-main: #050505;
          --panel-bg: #0c0c0c;
          --sidebar-bg: #111111;
          --accent: #22c55e;
          --accent-hover: #16a34a;
          --border-color: rgba(34, 197, 94, 0.2);
          --text-main: #4ade80;
          --text-muted: #15803d;
          --msg-self: #15803d;
          --msg-other: #121a12;
          --font-family: 'Fira Code', monospace;
        }

        body.theme-sunset {
          --bg-main: #140d10;
          --panel-bg: #1f1418;
          --sidebar-bg: #271a1f;
          --accent: #f97316;
          --accent-hover: #ea580c;
          --border-color: rgba(255, 255, 255, 0.08);
          --text-main: #fffbeb;
          --text-muted: #a16207;
          --msg-self: #f97316;
          --msg-other: #2e1d23;
        }

        body.light-mode {
          --bg-main: #e2e8f0;
          --panel-bg: #ffffff;
          --sidebar-bg: #f8fafc;
          --border-color: rgba(0, 0, 0, 0.08);
          --text-main: #0f172a;
          --text-muted: #64748b;
          --msg-self: var(--accent);
          --msg-other: #f1f5f9;
          --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }

        body { 
          display: flex; 
          justify-content: center; 
          align-items: center; 
          height: 100vh; 
          background-color: var(--bg-main); 
          color: var(--text-main); 
          overflow: hidden;
          transition: background-color 0.25s, color 0.25s;
          letter-spacing: -0.01em;
        }

        .auth-modal { 
          position: fixed; 
          inset: 0; 
          background: rgba(0, 0, 0, 0.75); 
          backdrop-filter: blur(8px); 
          display: flex; 
          justify-content: center; 
          align-items: center; 
          z-index: 1000; 
        }
        .auth-box { 
          background: var(--panel-bg); 
          padding: 32px; 
          border-radius: var(--radius-lg); 
          border: 1px solid var(--border-color); 
          width: 100%; 
          max-width: 380px; 
          display: flex; 
          flex-direction: column; 
          gap: 14px; 
          box-shadow: var(--glass-shadow); 
        }
        .auth-box h2 { 
          color: var(--text-main); 
          font-size: 1.4rem;
          font-weight: 700;
          text-align: center; 
          margin-bottom: 2px;
        }
        .auth-box input { 
          width: 100%; 
          background: rgba(255, 255, 255, 0.03); 
          border: 1px solid var(--border-color); 
          color: var(--text-main); 
          padding: 11px 14px; 
          border-radius: var(--radius-md); 
          outline: none; 
          font-size: 0.9rem; 
          transition: all 0.15s ease; 
        }
        .auth-box input:focus { 
          border-color: var(--accent); 
          box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); 
        }
        .auth-box button { 
          width: 100%; 
          padding: 12px; 
          background: var(--accent); 
          color: white; 
          border: none; 
          border-radius: var(--radius-md); 
          cursor: pointer; 
          font-weight: 600; 
          font-size: 0.95rem; 
          transition: all 0.15s ease; 
          margin-top: 4px;
        }
        .auth-box button:hover { 
          background: var(--accent-hover); 
        }
        .auth-toggle { 
          text-align: center; 
          color: var(--text-muted); 
          font-size: 0.85rem; 
          cursor: pointer; 
          transition: color 0.15s; 
        }
        .auth-toggle:hover { color: var(--text-main); }

        .chat-wrapper { 
          display: flex; 
          width: 1040px; 
          height: 760px; 
          max-width: 96vw;
          max-height: 94vh;
          background: var(--panel-bg); 
          border: 1px solid var(--border-color); 
          border-radius: var(--radius-lg); 
          box-shadow: var(--glass-shadow); 
          overflow: hidden; 
        }

        .sidebar { 
          width: 270px; 
          background: var(--sidebar-bg); 
          border-right: 1px solid var(--border-color); 
          padding: 18px 16px; 
          display: flex; 
          flex-direction: column; 
          gap: 16px; 
        }
        .brand { 
          display: flex; 
          align-items: center; 
          gap: 10px; 
          font-size: 1.15rem; 
          font-weight: 700; 
          color: var(--text-main); 
          padding: 0 4px;
        }
        .brand i { color: var(--accent); font-size: 1.25rem; }

        .avatar-wrapper {
          position: relative;
          display: inline-block;
          flex-shrink: 0;
        }
        
        .online-badge {
          position: absolute;
          bottom: 0px;
          right: 0px;
          width: 9px;
          height: 9px;
          background-color: #10b981; 
          border: 2px solid var(--panel-bg);
          border-radius: 50%;
        }
        .online-badge.offline {
          background-color: #6b7280; 
        }

        .channels-section { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
        .section-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
        
        .icon-btn { 
          background: transparent; 
          color: var(--text-muted); 
          border: none; 
          cursor: pointer; 
          padding: 6px 8px; 
          border-radius: 6px; 
          transition: all 0.15s ease; 
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
        .channels-list { display: flex; flex-direction: column; gap: 2px; }

        .channel-item { 
          display: flex; 
          align-items: center; 
          padding: 8px 10px; 
          border-radius: var(--radius-md); 
          cursor: pointer; 
          color: var(--text-muted); 
          font-size: 0.88rem; 
          font-weight: 500;
          transition: all 0.15s ease; 
          position: relative; 
        }
        .channel-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-main); }
        .channel-item.active { background: rgba(255, 255, 255, 0.07); color: var(--text-main); font-weight: 600; }
        .channel-item.active::before {
          content: '';
          position: absolute;
          left: 0;
          top: 6px;
          bottom: 6px;
          width: 3px;
          background: var(--accent);
          border-radius: 0 2px 2px 0;
        }
        .channel-item.unread { font-weight: 700; color: var(--text-main); }
        .channel-item.unread::after { content: ''; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; background: #ef4444; border-radius: 50%; }

        .user-card { 
          display: flex; 
          flex-direction: column; 
          gap: 10px; 
          background: rgba(0, 0, 0, 0.15); 
          padding: 12px; 
          border-radius: var(--radius-md); 
          border: 1px solid var(--border-color); 
        }
        .user-card label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
        .current-user-text { font-weight: 600; color: var(--text-main); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .mini-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
        
        .user-actions { display: flex; gap: 6px; }
        .settings-btn { 
          background: rgba(255,255,255,0.03); 
          border: 1px solid var(--border-color); 
          color: var(--text-main); 
          padding: 6px 8px; 
          border-radius: 6px; 
          cursor: pointer; 
          flex: 1; 
          font-size: 0.8rem;
          transition: background 0.15s; 
          outline: none;
        }
        .settings-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .color-picker-wrapper { position: relative; width: 30px; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
        .color-picker-wrapper input[type="color"] { position: absolute; inset: -10px; width: 50px; height: 50px; cursor: pointer; border: none; }
        
        .logout-btn { 
          background: rgba(239, 68, 68, 0.08); 
          border: 1px solid rgba(239, 68, 68, 0.2); 
          color: #ef4444; 
          padding: 6px; 
          border-radius: 6px; 
          cursor: pointer; 
          font-size: 0.8rem; 
          transition: all 0.15s; 
          flex: 1; 
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.18); }
        .old-version-btn { 
          display: block; 
          text-align: center; 
          padding: 8px; 
          border: 1px solid var(--border-color); 
          color: var(--text-muted); 
          text-decoration: none; 
          border-radius: var(--radius-md); 
          font-size: 0.8rem; 
          font-weight: 500; 
          transition: all 0.15s ease; 
        }
        .old-version-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-main); }
        
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); padding: 0 4px; }
        .pulse-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }

        .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--panel-bg); position: relative; }
        .chat-header { 
          padding: 14px 20px; 
          border-bottom: 1px solid var(--border-color); 
          display: flex; 
          justify-content: space-between; 
          align-items: center; 
        }
        .header-info h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-main); }
        .header-info p { font-size: 0.78rem; color: var(--text-muted); margin-top: 1px; }
        .chat-header-actions { display: flex; gap: 6px; }
        
        .chat-placeholder { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); gap: 12px; text-align: center; padding: 40px; }
        .chat-placeholder i { font-size: 2.8rem; color: var(--text-muted); opacity: 0.4; }
        .chat-placeholder h2 { color: var(--text-main); font-weight: 600; font-size: 1.2rem; }
        .chat-placeholder p { font-size: 0.88rem; }
        
        .chat-box { 
          flex: 1; 
          padding: 20px; 
          overflow-y: auto; 
          display: flex; 
          flex-direction: column; 
          gap: 12px; 
          scroll-behavior: smooth; 
        }
        
        .message-row { display: flex; gap: 10px; align-items: flex-start; max-width: 82%; position: relative; }
        .message-row.self { align-self: flex-end; flex-direction: row-reverse; }
        
        .message-row.system { max-width: 100%; justify-content: center; align-self: center; margin: 4px 0; }
        .message-row.system .message { background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-size: 0.78rem; text-align: center; padding: 4px 14px; border-radius: 12px; border: 1px solid var(--border-color); font-style: italic; }
        .message-row.system .avatar-wrapper, .message-row.system .msg-header, .message-row.system .msg-actions { display: none; }

        .chat-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        
        .message { 
          padding: 10px 14px; 
          border-radius: 12px; 
          background: var(--msg-other); 
          color: var(--text-main); 
          word-break: break-word; 
          position: relative; 
          border: 1px solid var(--border-color);
        }
        .message-row.self .message { 
          background: var(--msg-self); 
          color: white; 
          border-top-right-radius: 2px; 
          border: none;
        }
        .message-row:not(.self):not(.system) .message { border-top-left-radius: 2px; }
        
        .msg-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; gap: 10px; }
        .msg-user { font-weight: 600; font-size: 0.78rem; color: var(--accent); }
        .msg-time { font-size: 0.65rem; color: var(--text-muted); opacity: 0.85; white-space: nowrap; }
        .message-row.self .msg-user, .message-row.self .msg-time { color: rgba(255,255,255,0.85); }
        .msg-text { font-size: 0.9rem; line-height: 1.45; display: block; white-space: pre-wrap; }
        
        .msg-attachment-img { max-width: 100%; max-height: 260px; border-radius: 8px; margin-top: 6px; display: block; border: 1px solid var(--border-color); }
        .msg-attachment-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500; word-break: break-all; }
        .msg-attachment-link:hover { text-decoration: underline; }

        .html-preview-container {
            margin-top: 6px;
            width: 100%;
            min-width: 260px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
        }
        .html-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .html-preview-iframe {
            width: 100%;
            height: 250px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
        }

        .msg-actions { display: none; position: absolute; top: -10px; right: 8px; background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 2px 4px; gap: 2px; }
        .message-row.self:not(.system):hover .msg-actions { display: flex; }
        .msg-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.72rem; padding: 3px 5px; border-radius: 4px; }
        .msg-action-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.08); }
        .msg-action-btn.delete-btn:hover { color: #ef4444; }

        .typing-indicator { 
          display: none; 
          align-items: center; 
          gap: 6px; 
          padding: 6px 20px; 
          font-size: 0.78rem; 
          color: var(--text-muted); 
        }
        .typing-dots { display: inline-flex; gap: 3px; }
        .typing-dot { width: 3px; height: 3px; background: var(--text-muted); border-radius: 50%; animation: typingBounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        .chat-input-container { 
          display: flex; 
          padding: 12px 20px 16px; 
          background: var(--panel-bg); 
          gap: 8px; 
          align-items: flex-end; 
          position: relative;
        }
        .input-dock {
          flex: 1;
          display: flex;
          align-items: center;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid var(--border-color);
          border-radius: var(--radius-md);
          padding: 4px 8px;
          gap: 4px;
          transition: border-color 0.15s ease;
        }
        .input-dock:focus-within {
          border-color: var(--accent);
        }
        .input-dock textarea { 
          flex: 1; 
          background: transparent; 
          border: none; 
          color: var(--text-main); 
          padding: 8px 6px; 
          outline: none; 
          font-size: 0.9rem; 
          resize: none; 
          min-height: 38px; 
          max-height: 110px; 
          overflow-y: auto; 
          line-height: 1.4; 
        }
        .dock-btn {
          background: transparent;
          border: none;
          color: var(--text-muted);
          width: 32px;
          height: 32px;
          border-radius: 6px;
          cursor: pointer;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 0.95rem;
          transition: all 0.15s ease;
          flex-shrink: 0;
        }
        .dock-btn:hover {
          color: var(--text-main);
          background: rgba(255, 255, 255, 0.06);
        }
        .send-btn { 
          background: var(--accent); 
          border: none; 
          color: white; 
          width: 38px; 
          height: 38px; 
          border-radius: var(--radius-md); 
          cursor: pointer; 
          display: flex; 
          justify-content: center; 
          align-items: center; 
          font-size: 0.95rem; 
          transition: all 0.15s ease; 
          flex-shrink: 0; 
        }
        .send-btn:hover { background: var(--accent-hover); }

        /* Emoji Picker Popover */
        .emoji-picker {
          position: absolute;
          bottom: 70px;
          left: 20px;
          width: 310px;
          max-height: 240px;
          background: var(--sidebar-bg);
          border: 1px solid var(--border-color);
          border-radius: var(--radius-md);
          box-shadow: var(--glass-shadow);
          display: none;
          flex-direction: column;
          z-index: 100;
          padding: 10px;
        }
        .emoji-picker.active { display: flex; }
        .emoji-picker-header {
          font-size: 0.72rem;
          color: var(--text-muted);
          text-transform: uppercase;
          font-weight: 700;
          margin-bottom: 8px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .emoji-picker-grid {
          display: grid;
          grid-template-columns: repeat(8, 1fr);
          gap: 4px;
          overflow-y: auto;
          max-height: 190px;
          padding-right: 2px;
        }
        .emoji-chip {
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.2rem;
          padding: 5px;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.12s ease;
          user-select: none;
        }
        .emoji-chip:hover {
          background: rgba(255, 255, 255, 0.1);
        }

        .chat-box::-webkit-scrollbar, .channels-section::-webkit-scrollbar, .input-dock textarea::-webkit-scrollbar, .emoji-picker-grid::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-track, .channels-section::-webkit-scrollbar-track, .input-dock textarea::-webkit-scrollbar-track, .emoji-picker-grid::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb, .channels-section::-webkit-scrollbar-thumb, .input-dock textarea::-webkit-scrollbar-thumb, .emoji-picker-grid::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes typingBounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }

        @media(max-width: 768px) { .chat-wrapper { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; border: none; } .sidebar { display: none; } }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <h2 id="authTitle">Create Account</h2>
            <form id="authForm">
                <div id="registerFields">
                    <input type="text" id="firstName" placeholder="First Name">
                    <input type="text" id="lastName" placeholder="Last Name">
                </div>
                <input type="text" id="authUsername" placeholder="Username" required autocomplete="off">
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="authBtn">Sign Up</button>
            </form>
            <p class="auth-toggle" id="toggleAuth">Already have an account? Log in.</p>
        </div>
    </div>

    <!-- Mod Panel Modal (Independent from authModal) -->
    <div id="modPanelModal" class="auth-modal" style="display: none; z-index: 1500;">
        <div class="auth-box" style="max-width: 450px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2><i class="fa-solid fa-shield-halved" style="color: var(--accent);"></i> Mod Panel</h2>
                <button class="icon-btn" id="closeModPanel"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="mod-section">
                <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Target User / Input</label>
                <input type="text" id="modTargetInput" placeholder="Enter username or message / lang..." autocomplete="off">
            </div>

            <div class="mod-section" style="margin-top: 10px;">
                <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Moderator</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
                    <button onclick="dispatchCmd('/block')">Block User</button>
                    <button onclick="dispatchCmd('/unblock')">Unblock User</button>
                    <button onclick="dispatchCmd('/lock')">Lock Room</button>
                    <button onclick="dispatchCmd('/unlock')">Unlock Room</button>
                    <button onclick="dispatchCmd('/addtogc')">Add to GC</button>
                    <button onclick="dispatchCmd('/removefromgc')">Remove from GC</button>
                    <button onclick="dispatchCmd('/language')">Local Lang (/language)</button>
                    <button onclick="dispatchCmd('/listall')">List All Users (/listall)</button>
                    <button onclick="dispatchCmd('/system')" style="grid-column: span 2;">Send System Message</button>
                </div>
            </div>

            <div class="mod-section" style="margin-top: 10px;">
                <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Super Moderator</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">

    async function translateText(text, targetLang) {
        if (!text || !targetLang || targetLang === 'off') return text;
        if (text.startsWith('[IMG]') || text.startsWith('[FILE=') || text.includes('[HTML=')) return text;
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            if (data && data[0]) {
                return data[0].map(item => item[0]).join('');
            }
        } catch (err) {
            console.error('Translation failed:', err);
        }
        return text;
    }

    function getCurrentUsername() {
        return currentUser?.user_metadata?.username || currentUser?.email?.split('@')[0] || 'Anonymous';

    function formatMessageText(text) {
        let formatted = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="msg-attachment-link" style="margin-top: 0; display: inline;">$1</a>');
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        formatted = formatted.replace(/\*(.*?)\*/g, '<i>$1</i>');
        return formatted;
    }

    function requestNotificationPermission() { if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") Notification.requestPermission().catch(err => console.log("Permission skipped:", err)); }
    
    function showNotification(username, message, channelName = '') { 
        if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
            let displayMsg = message;
            if (displayMsg.startsWith('[IMG]')) displayMsg = '📷 Sent an image';
            else if (displayMsg.startsWith('[FILE=')) displayMsg = '📎 Sent a file';
            else if (displayMsg.includes('[HTML=')) displayMsg = '📄 Sent an HTML document';

            const title = channelName ? `#${channelName} • ${username}` : `New message from ${username}`;
            new Notification(title, { body: displayMsg, icon: getAvatarUrl(username) }); 
        }
    }

    function initRealtime() {
        if (window.msgChannel) return;

        typingChannel = supabase2.channel('typing-room', { config: { broadcast: { self: false } } });
        
        typingChannel.on('broadcast', { event: 'typing' }, ({ payload }) => {
            const myUsername = getCurrentUsername();
            if (String(payload.room_id) === String(activeRoomId) && payload.username !== myUsername) {
                typingText.textContent = `${payload.username} is typing`;
                typingIndicator.style.display = 'flex';
                
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => { 
                    typingIndicator.style.display = 'none'; 
                }, 2500);
            }
        }).on('broadcast', { event: 'user_renamed' }, ({ payload }) => {
            const { oldUser, newUser } = payload;
            
            if (getCurrentUsername() === oldUser) {
                if (currentUser.user_metadata) currentUser.user_metadata.username = newUser;
                currentUserName.textContent = newUser;
                currentUserAvatar.src = getAvatarUrl(newUser, getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
            }

            if (typingText.textContent.includes(oldUser)) {
                typingText.textContent = typingText.textContent.replace(oldUser, newUser);
            }

            fetchRooms();
            if (activeRoomId) fetchMessages();
        }).subscribe();

        window.msgChannel = supabase2
            .channel('db-changes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                const msgRoomId = String(payload.new.room_id);

                if (!userRoomsMap.has(msgRoomId)) return;

                if (activeRoomId && msgRoomId === String(activeRoomId)) {
                    if (!document.getElementById(`msg-${payload.new.id}`)) appendMessage(payload.new);
                } else {
                    const unreadEl = document.querySelector(`.channel-item[data-id="${payload.new.room_id}"]`);
                    if (unreadEl) unreadEl.classList.add('unread');
                }

                try { 
                    if (currentUser && payload.new.username !== getCurrentUsername()) {
                        const channelName = userRoomsMap.get(msgRoomId) || '';
                        showNotification(payload.new.username, payload.new.content, channelName); 
                        notificationSound.play().catch(e => console.log("Audio play blocked by browser interaction rules"));
                    }
                } catch (err) {}
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, (payload) => {
                const rowElem = document.getElementById(`msg-${payload.new.id}`);
                if (rowElem) {
                    const textElem = document.getElementById(`msg-text-${payload.new.id}`);
                    if (textElem) {
                        if (localLangFilter) {
                            applyLocalTranslation(payload.new.id, payload.new.content);
                        } else {
                            textElem.textContent = payload.new.content;
                        }
                    }

                    const userElem = rowElem.querySelector('.msg-user');
                    const avatarElem = rowElem.querySelector('.chat-avatar');
                    const isSelf = currentUser && payload.new.username === currentUser.user_metadata?.username;
                    
                    if (userElem) userElem.textContent = isSelf ? 'You' : payload.new.username;
                    if (avatarElem) {
                        const avatarColor = isSelf ? getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() : '374151';
                        avatarElem.src = getAvatarUrl(payload.new.username, avatarColor);
                        avatarElem.alt = payload.new.username;
                    }
                }
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (payload) => {
                const deletedId = payload.old?.id;
                if (deletedId) {
                    const rowElem = document.getElementById(`msg-${deletedId}`); 
                    if (rowElem) rowElem.remove();
                }
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms' }, (payload) => {
                const updatedRoom = payload.new;
                if (activeRoomId === updatedRoom.id && updatedRoom.name.includes(' — [')) {
                    const members = updatedRoom.name.split(' — [')[1].replace(']', '').split(',').map(s => s.trim());
                    if (!members.includes(currentUser.user_metadata?.username)) {
                        activeRoomId = null; chatPlaceholder.style.display = 'flex'; chatBox.style.display = 'none'; messageForm.style.display = 'none'; chatActions.style.display = 'none'; currentChannelName.textContent = "No Chat Selected"; currentChannelDesc.textContent = "Select a chat to begin messaging";
                        alert("You have been removed from this group chat.");
                    } else { activeRoomRawName = updatedRoom.name; currentChannelDesc.textContent = `Members: ${activeRoomRawName.split(' — ')[1]}`; }
                }
                fetchRooms();
            })
            .subscribe();
    }

    async function checkSession() {
        const { data: { session } } = await supabase2.auth.getSession();
        if (session) {
            currentUser = session.user; authModal.style.display = "none"; mainApp.style.display = "flex";

            fetchRooms(); requestNotificationPermission(); initRealtime(); initPresence();
        } else { authModal.style.display = "flex"; mainApp.style.display = "none"; }
    }

        userRoomsMap.clear();
        
        checkSession();
    });

    addUserBtn.addEventListener('click', async () => {
        if (!activeRoomId) return;
        const newUsers = prompt("Enter usernames to add to this chat (comma-separated):");
        if (!newUsers) return;

        let updatedName = activeRoomRawName;
        if (updatedName.includes(' — [')) {
            const base = updatedName.split(' — [')[0], existing = updatedName.split(' — [')[1].replace(']', '');
            updatedName = `${base} — [${existing}, ${newUsers}]`;
        } else { updatedName = `${updatedName} — [${newUsers}]`; }

        const { error } = await supabase2.from('rooms').update({ name: updatedName }).eq('id', activeRoomId);

    async function fetchRooms() {
        const { data: rooms, error } = await supabase2.from('rooms').select('*').order('name', { ascending: true });
        if (error) return console.error('Error loading chat groups:', error);

        channelsList.innerHTML = ''; 
        userRoomsMap.clear();

        if (rooms && rooms.length > 0) {
            const myUsername = currentUser.user_metadata?.username;
            rooms.forEach((room) => {
                if (room.name.includes(' — [')) {
                    const membersStr = room.name.split(' — [')[1].replace(']', '');
                    if (!membersStr.split(',').map(s => s.trim()).includes(myUsername)) return; 
                }

                const cleanName = room.name.split(' — ')[0];
                userRoomsMap.set(String(room.id), cleanName);

                const roomEl = document.createElement('div'); 
                roomEl.classList.add('channel-item'); 
                roomEl.setAttribute('data-id', room.id);
                roomEl.innerHTML = `<i class="fa-solid fa-hashtag" style="margin-right: 8px; opacity: 0.5;"></i> ${cleanName}`;
                roomEl.addEventListener('click', () => { switchRoom(room.id, room.name); roomEl.classList.remove('unread'); });
                channelsList.appendChild(roomEl);
            });
            if (activeRoomId) document.querySelectorAll('.channel-item').forEach(el => { if (el.getAttribute('data-id') === activeRoomId) el.classList.add('active'); });
        }
    }

    async function switchRoom(roomId, roomName) {
        if (activeRoomId === roomId) return;
        activeRoomId = roomId; activeRoomRawName = roomName;
        typingIndicator.style.display = 'none';
        chatPlaceholder.style.display = 'none'; chatBox.style.display = 'flex'; messageForm.style.display = 'flex'; chatActions.style.display = 'flex';
        currentChannelName.textContent = `# ${roomName.split(' — ')[0]}`;
        currentChannelDesc.textContent = roomName.includes(' — ') ? `Members: ${roomName.split(' — ')[1]}` : "Real-time chat active";
        
        document.querySelectorAll('.channel-item').forEach(el => { if (el.getAttribute('data-id') === roomId) el.classList.add('active'); else el.classList.remove('active'); });
        chatBox.innerHTML = ''; await fetchMessages();
    }

    async function fetchMessages() {
        if (!activeRoomId) return;
        const { data, error } = await supabase2.from('messages').select('*').eq('room_id', activeRoomId).order('created_at', { ascending: true });
        if (error) console.error('Error loading history:', error); else {
            chatBox.innerHTML = '';
            data.forEach(msg => appendMessage(msg));

    async function applyLocalTranslation(msgId, originalContent) {
        if (!localLangFilter || localLangFilter === 'off') return;
        const textElem = document.getElementById(`msg-text-${msgId}`);
        if (!textElem) return;
        const translated = await translateText(originalContent, localLangFilter);
        if (translated && textElem) {
            const tempDiv = document.createElement('div'); 
            tempDiv.textContent = translated; 
            textElem.innerHTML = formatMessageText(tempDiv.innerHTML);
        }
    }

    function appendMessage(msg) {
        if (!currentUser) return;
        const msgUsername = msg.username || 'Anonymous';
        const isSelf = msgUsername === currentUser.user_metadata?.username; 
        
        const timeString = msg.created_at 
            ? new Date(msg.created_at).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) 
            : new Date().toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        
        const rowElement = document.createElement('div'); 
        rowElement.classList.add('message-row'); 
        rowElement.setAttribute('id', `msg-${msg.id}`);
        if (isSelf) rowElement.classList.add('self');
        if (msgUsername === 'System') rowElement.classList.add('system');

        const avatarColor = isSelf ? getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() : '374151';
        const actionsHtml = isSelf && msgUsername !== 'System' ? `<div class="msg-actions"><button class="msg-action-btn" onclick="editMessage('${msg.id}', '${encodeURIComponent(msg.content)}')"><i class="fa-solid fa-pen"></i></button><button class="msg-action-btn delete-btn" onclick="deleteMessage('${msg.id}')"><i class="fa-solid fa-trash"></i></button></div>` : '';

        let formattedContent = msg.content || '';
        let pendingIframeLoad = null;

        if (typeof formattedContent === 'string') {
            if (formattedContent.startsWith('[IMG]') && formattedContent.endsWith('[/IMG]')) {
                const imgUrl = formattedContent.replace('[IMG]', '').replace('[/IMG]', '');
                formattedContent = `<img src="${imgUrl}" class="msg-attachment-img" alt="Uploaded Image">`;
            } else if (formattedContent.match(/\[HTML=(.*?)\](.*?)\[\/HTML\]/)) {
                const match = formattedContent.match(/\[HTML=(.*?)\](.*?)\[\/HTML\]/);
                if (match) {
                    const fileName = match[1];
                    const fileUrl = match[2];
                    const iframeId = `preview-iframe-${msg.id || Math.random().toString(36).substring(2)}`;

                    formattedContent = `
                    <div class="html-preview-container">
                        <div class="html-preview-header">
                            <span style="font-size: 0.8rem; color: var(--text-muted);"><i class="fa-solid fa-code"></i> Preview: <b>${fileName}</b></span>
                            <a href="${fileUrl}" target="_blank" class="msg-attachment-link" style="margin-top: 0;"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open Tab</a>
                        </div>
                        <iframe id="${iframeId}" class="html-preview-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
                    </div>`;

                    pendingIframeLoad = () => {
                        fetch(fileUrl)
                            .then(res => res.text())
                            .then(html => {
                                const iframe = document.getElementById(iframeId);
                                if (iframe) iframe.srcdoc = html;
                            })
                            .catch(err => console.error('Error rendering HTML preview:', err));
                    };
                }
            } else if (formattedContent.startsWith('[FILE=') && formattedContent.endsWith('[/FILE]')) {
                const match = formattedContent.match(/\[FILE=(.*?)\](.*?)\[\/FILE\]/);
                if (match) formattedContent = `<a href="${match[2]}" target="_blank" class="msg-attachment-link"><i class="fa-solid fa-file-arrow-down"></i> Download: ${match[1]}</a>`;
            } else { 
                const tempDiv = document.createElement('div'); 
                tempDiv.textContent = formattedContent; 
                formattedContent = formatMessageText(tempDiv.innerHTML); 
            }
        }

        const isOnline = onlineUsers.has(msgUsername);
        const avatarUrl = getAvatarUrl(msgUsername, avatarColor);

        rowElement.innerHTML = `
            <div class="avatar-wrapper" data-username="${msgUsername}">
                <img src="${avatarUrl}" alt="${msgUsername}" class="chat-avatar">
                <span class="online-badge ${isOnline ? '' : 'offline'}"></span>
            </div>
            <div class="message">
                ${actionsHtml}
                <div class="msg-header">
                    <span class="msg-user">${isSelf ? 'You' : msgUsername}</span>
                    <span class="msg-time">${timeString}</span>
                </div>
                <span class="msg-text" id="msg-text-${msg.id}">${formattedContent}</span>
            </div>
        `;

        chatBox.appendChild(rowElement);
        if (pendingIframeLoad) pendingIframeLoad();
        
        if (localLangFilter && msg.content && msgUsername !== 'System') {
            applyLocalTranslation(msg.id, msg.content);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function editMessage(msgId, encodedContent) {

    async function deleteMessage(msgId) {

        try {
            const { error } = await supabase2.from('messages').delete().eq('id', msgId);
            if (error) {
                alert("Failed to delete message: " + error.message);
            } else {
                const rowElem = document.getElementById(`msg-${msgId}`);
                if (rowElem) rowElem.remove();
            }

            alert("Error deleting message: " + err.message);
        }

    function initPresence() {
        if (presenceChannel || !currentUser) return;
        
        const uname = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    
        presenceChannel = supabase2.channel('online-presence', {
            config: { presence: { key: uname } }
        });
    
        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                const state = presenceChannel.presenceState();
                onlineUsers.clear();
                
                Object.keys(state).forEach(username => {
                    onlineUsers.add(username);

                updateOnlineStatusUI();

                        username: uname
                    });
                }
            });

                    try {

                        const { data: msgUsers } = await supabase2.from('messages').select('username');

                            msgUsers.forEach(m => {
                                if (m.username && m.username !== 'System') allUsernames.add(m.username);
                            });
                        }

                        allUsernames.add('hamzaperson2026');
                        if (currentUser?.user_metadata?.username) {
                            allUsernames.add(currentUser.user_metadata.username);
                        }

                        let summaryStr = "--- All Users & Roles ---\n";
                        allUsernames.forEach(uname => {
                            let roleStr = 'user';
                            if (uname === 'hamzaperson2026') {
                                roleStr = 'Owner';
                            } else if (roleMap.has(uname)) {
                                roleStr = roleMap.get(uname);
                            }
                            summaryStr += `• ${uname} : [${roleStr.toUpperCase()}]\n`;
                        });

                        alert(summaryStr);
                    } catch (err) {
                        alert("Failed to fetch user list: " + err.message);
                    }
                    break;

                case 'language':
                case 'lang':
                    if (!isMod) return alert("Only mods and above can use /language.");
                    if (!target) return alert("Usage: /language [lang_code] (e.g., /language es, /language fr, or /language off)");
                    
                    localLangFilter = target.toLowerCase() === 'off' ? null : target;
                    alert(localLangFilter ? `Local view translation set to '${localLangFilter}'. Re-rendering messages...` : "Local view translation turned off.");
                    if (activeRoomId) fetchMessages();
                    break;

                case 'languageall':
                case 'langall':
                    if (!isSuperMod) return alert("Only supermods can translate room messages for everyone.");
                    if (!target) return alert("Usage: /languageall [lang_code] (e.g., /languageall es, /languageall en)");

                    if (!confirm(`Are you sure you want to translate ALL messages in this chat to '${target}' for everyone?`)) return;

                    try {
                        const { data: roomMsgs, error: fetchErr } = await supabase2
                            .from('messages')
                            .select('id, content')
                            .eq('room_id', activeRoomId);

                        if (fetchErr) return alert("Error fetching room messages: " + fetchErr.message);

                        let count = 0;
                        for (const msgItem of roomMsgs) {
                            if (msgItem.content && !msgItem.content.startsWith('[IMG]') && !msgItem.content.startsWith('[FILE=') && !msgItem.content.includes('[HTML=')) {
                                const translated = await translateText(msgItem.content, target);
                                if (translated && translated !== msgItem.content) {
                                    await supabase2.from('messages').update({ content: translated }).eq('id', msgItem.id);
                                    count++;

                            }
                        }

                        await sendSystemMessage(activeRoomId, `System: All messages in this chat were translated to '${target}' by a Super Moderator.`);
                        alert(`Successfully translated ${count} message(s) for everyone.`);

                        alert("Global translation failed: " + err.message);
                    }
                    break;

                case 'rename':
                    if (!isMod) return alert("Only mods and above can rename users.");
                    const oldUser = parts[1];
                    const newUser = parts[2];
                    if (!oldUser || !newUser) return alert("Usage: /rename [olduser] [newuser]");

                    try {
                        const { error: msgErr } = await supabase2.from('messages').update({ username: newUser }).eq('username', oldUser);
                        if (msgErr) alert("Warning updating messages: " + msgErr.message);

                        await supabase2.from('user_roles').update({ username: newUser }).eq('username', oldUser);

                        const { data: rooms } = await supabase2.from('rooms').select('*');
                        if (rooms) {
                            for (const r of rooms) {
                                if (r.name.includes(' — [')) {
                                    const roomParts = r.name.split(' — [');
                                    const members = roomParts[1].replace(']', '').split(',').map(s => s.trim());
                                    if (members.includes(oldUser)) {
                                        const updatedMembers = members.map(m => m === oldUser ? newUser : m).join(', ');
                                        const updatedRoomName = `${roomParts[0]} — [${updatedMembers}]`;
                                        await supabase2.from('rooms').update({ name: updatedRoomName }).eq('id', r.id);

                            }

                        fetchRooms();
                        if (activeRoomId) fetchMessages();
                    } catch (err) {
                        alert("Rename failed: " + err.message);
                    }
                    break;

                case 'block': 
                    if (!isMod) return alert("Only mods can block.");
                    if (!target) return alert("Usage: /block [username]");

                    if (!activeRoomRawName.includes(' — [')) return alert("Not a private group chat.");

        const target = modTargetInput.value.trim();
        
        // Commands that don't need a target parameter
        const noTargetCmds = ['/lock', '/unlock', '/listall'];
        
        if (!noTargetCmds.includes(baseCmd) && !target) {
            alert("Please enter a target username, message, or language code in the input field above.");
            return;
        }

        // Format the command string (e.g. "/language es")
        let fullCommand = baseCmd;
        if (target && !noTargetCmds.includes(baseCmd)) {
            fullCommand = `${baseCmd} ${target}`;
        }

        // Inject into existing input and simulate form submission
        messageInput.value = fullCommand;
        messageForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        
        // Clear input after execution
        modTargetInput.value = '';
    };

    // Special function for renaming since it requires two parameters
    window.dispatchRenameCmd = function() {
        const oldName = renameOldInput.value.trim();
        const newName = renameNewInput.value.trim();
        
        if (!oldName || !newName) {
            alert("Please provide both the old username and the new username.");
            return;
        }
        
        messageInput.value = `/rename ${oldName} ${newName}`;
        messageForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        
        renameOldInput.value = '';
        renameNewInput.value = '';
    };
  </script>
</body>
</html>
