<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Chat App</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #4f46e5;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* App Layout */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* Sidebar */
        .sidebar { width: 280px; background-color: var(--bg-secondary); border-right: 1px solid var(--bg-tertiary); display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--bg-tertiary); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-actions { padding: 12px; display: flex; gap: 8px; }
        .channels-list { flex: 1; overflow-y: auto; padding: 8px; }
        .channel-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; margin-bottom: 4px; }
        .channel-item:hover { background-color: var(--bg-tertiary); color: var(--text-main); }
        .channel-item.active { background-color: var(--accent); color: #fff; }
        .channel-item.unread { font-weight: bold; color: #fff; }

        /* Main Chat Area */
        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-primary); }
        .chat-header { height: 60px; padding: 0 20px; border-bottom: 1px solid var(--bg-tertiary); display: flex; justify-content: space-between; align-items: center; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

        /* Messages */
        .message-row { display: flex; gap: 12px; max-width: 80%; }
        .message-row.self { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.system { align-self: center; max-width: 100%; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #374151; }
        .message { background-color: var(--bg-secondary); padding: 10px 14px; border-radius: 8px; position: relative; }
        .message-row.self .message { background-color: var(--accent); }
        .message-row.system .message { background-color: transparent; color: var(--text-muted); font-style: italic; }
        
        .msg-header { display: flex; gap: 8px; margin-bottom: 4px; font-size: 0.75rem; color: var(--text-muted); }
        .message-row.self .msg-header { color: #e0e7ff; }
        .msg-user { font-weight: bold; }
        .msg-actions { position: absolute; top: -10px; right: 10px; background: var(--bg-tertiary); border-radius: 4px; display: none; }
        .message:hover .msg-actions { display: flex; }
        .msg-action-btn { background: none; border: none; color: var(--text-main); padding: 4px 6px; cursor: pointer; }
        .msg-action-btn:hover { color: #ef4444; }

        /* Media Attachments */
        .msg-attachment-img { max-width: 300px; max-height: 300px; border-radius: 6px; margin-top: 6px; display: block; }
        .msg-attachment-link { color: #60a5fa; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }

        /* Input Controls */
        .message-form { padding: 16px; border-top: 1px solid var(--bg-tertiary); display: flex; gap: 10px; }
        .message-input { flex: 1; background-color: var(--bg-secondary); border: 1px solid var(--bg-tertiary); color: var(--text-main); padding: 12px; border-radius: 6px; outline: none; }
        .btn { background-color: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-icon { background-color: var(--bg-tertiary); color: var(--text-main); }
    </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Channels</h3>
        <button id="logoutBtn" class="btn-icon btn"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
      <div class="sidebar-actions">
        <button id="createChatBtn" class="btn" style="flex:1;"><i class="fa-solid fa-plus"></i> New Room</button>
      </div>
      <div id="channelsList" class="channels-list"></div>
    </div>

    <!-- Main Chat Workspace -->
    <div class="chat-main">
      <div id="chatPlaceholder" class="chat-placeholder">
        <p>Select a room or start a new chat to begin messaging.</p>
      </div>

      <div id="chatHeader" class="chat-header" style="display: none;">
        <div>
          <h2 id="currentChannelName"># general</h2>
          <small id="currentChannelDesc" style="color: var(--text-muted);"></small>
        </div>
        <div id="chatActions" style="display: none;">
          <button id="addUserBtn" class="btn btn-icon"><i class="fa-solid fa-user-plus"></i></button>
        </div>
      </div>

      <div id="chatBox" class="chat-box" style="display: none;"></div>

      <form id="messageForm" class="message-form" style="display: none;">
        <input type="file" id="fileInput" style="display: none;">
        <button type="button" id="attachBtn" class="btn btn-icon"><i class="fa-solid fa-paperclip"></i></button>
        <input type="text" id="messageInput" class="message-input" placeholder="Type a message or / command..." autocomplete="off">
        <button type="submit" class="btn"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </div>

  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase2 = supabaseClient.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Global State Variables
    let currentUser = null;
    let activeRoomId = null;
    let activeRoomRawName = '';
    let typingChannel = null;

    // DOM Elements
    const channelsList = document.getElementById('channelsList');
    const chatBox = document.getElementById('chatBox');
    const chatPlaceholder = document.getElementById('chatPlaceholder');
    const chatHeader = document.getElementById('chatHeader');
    const currentChannelName = document.getElementById('currentChannelName');
    const currentChannelDesc = document.getElementById('currentChannelDesc');
    const chatActions = document.getElementById('chatActions');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const createChatBtn = document.getElementById('createChatBtn');
    const addUserBtn = document.getElementById('addUserBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const logoutBtn = document.getElementById('logoutBtn');

    // Utility Avatar Helper
    function getAvatarUrl(username, color) {
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=${color}&color=fff`;
    }

    // Session Management
    async function checkSession() {
        const { data: { session } } = await supabase2.auth.getSession();
        if (session) {
            currentUser = session.user;
            fetchRooms();
        } else {
            // Redirect to login or handle unauthenticated state
            console.log("No active auth session.");
        }
    }

    function applySavedPreferences() {
        // Placeholder for restoring UI configurations
    }

    // Logout
    logoutBtn.addEventListener('click', async () => {
        await supabase2.auth.signOut(); 
        if (window.msgChannel) supabase2.removeChannel(window.msgChannel);
        if (typingChannel) supabase2.removeChannel(typingChannel);
        window.msgChannel = null;
        typingChannel = null;
        location.reload();
    });

    async function sendSystemMessage(roomId, content) {
        await supabase2.from('messages').insert([{ room_id: roomId, content: content, username: 'System' }]);
    }

    // Add User to Room
    addUserBtn.addEventListener('click', async () => {
        if (!activeRoomId) return;
        const newUsers = prompt("Enter usernames to add to this chat (comma-separated):");
        if (!newUsers) return;

        let updatedName = activeRoomRawName;
        if (updatedName.includes(' — [')) {
            const [base, existing] = updatedName.split(' — [');
            const cleanExisting = existing.replace(']', '');
            updatedName = `${base} — [${cleanExisting}, ${newUsers}]`;
        } else { 
            updatedName = `${updatedName} — [${newUsers}]`; 
        }

        const { error } = await supabase2.from('rooms').update({ name: updatedName }).eq('id', activeRoomId);
        if (error) {
            alert("Error adding users: " + error.message);
        } else {
            activeRoomRawName = updatedName; 
            currentChannelDesc.textContent = `Members: ${updatedName.split(' — ')[1] || ''}`;
            await sendSystemMessage(activeRoomId, `${currentUser.user_metadata?.username} added: ${newUsers}`);
            fetchRooms();
        }
    });

    // Create New Room
    createChatBtn.addEventListener('click', async () => {
        const roomName = prompt("Enter a name for this chat:"); 
        if (!roomName) return;
        
        const invitees = prompt("Enter usernames to invite (optional, comma-separated):");
        const myUsername = currentUser?.user_metadata?.username || 'Anonymous';
        const finalInvitees = invitees ? `${myUsername}, ${invitees}` : myUsername;
        const finalRoomName = `${roomName} — [${finalInvitees}]`;

        const { error } = await supabase2.from('rooms').insert([{ name: finalRoomName }]);
        if (error) alert("Error creating room: " + error.message); 
        else fetchRooms();
    });

    // Fetch Accessible Rooms
    async function fetchRooms() {
        const { data: rooms, error } = await supabase2.from('rooms').select('*').order('name', { ascending: true });
        if (error) return console.error('Error loading chat groups:', error);

        channelsList.innerHTML = ''; 
        if (rooms && rooms.length > 0) {
            const myUsername = currentUser?.user_metadata?.username;
            rooms.forEach((room) => {
                if (room.name.includes(' — [')) {
                    const membersStr = room.name.split(' — [')[1].replace(']', '');
                    const members = membersStr.split(',').map(s => s.trim());
                    if (!members.includes(myUsername)) return; 
                }

                const roomEl = document.createElement('div'); 
                roomEl.classList.add('channel-item'); 
                roomEl.setAttribute('data-id', room.id);
                roomEl.innerHTML = `<i class="fa-solid fa-hashtag" style="margin-right: 8px;"></i> ${room.name.split(' — ')[0]}`;
                
                roomEl.addEventListener('click', () => { 
                    switchRoom(room.id, room.name); 
                    roomEl.classList.remove('unread'); 
                });
                channelsList.appendChild(roomEl);
            });
            
            if (activeRoomId) {
                document.querySelectorAll('.channel-item').forEach(el => { 
                    if (el.getAttribute('data-id') === activeRoomId) el.classList.add('active'); 
                });
            }
        }
    }

    // Switch Active Room
    async function switchRoom(roomId, roomName) {
        if (activeRoomId === roomId) return;
        activeRoomId = roomId; 
        activeRoomRawName = roomName;
        
        chatPlaceholder.style.display = 'none'; 
        chatHeader.style.display = 'flex';
        chatBox.style.display = 'flex'; 
        messageForm.style.display = 'flex'; 
        chatActions.style.display = 'flex';
        
        currentChannelName.textContent = `# ${roomName.split(' — ')[0]}`;
        currentChannelDesc.textContent = roomName.includes(' — ') 
            ? `Members: ${roomName.split(' — ')[1]}` 
            : "Real-time end-to-end database sync";
        
        document.querySelectorAll('.channel-item').forEach(el => { 
            if (el.getAttribute('data-id') === roomId) el.classList.add('active'); 
            else el.classList.remove('active'); 
        });
        
        chatBox.innerHTML = ''; 
        await fetchMessages();
    }

    // Fetch Room Messages
    async function fetchMessages() {
        if (!activeRoomId) return;
        const { data, error } = await supabase2.from('messages').select('*').eq('room_id', activeRoomId).order('created_at', { ascending: true });
        if (error) console.error('Error loading history:', error); 
        else data.forEach(msg => appendMessage(msg));
    }

    // Append Message Element Safely
    function appendMessage(msg) {
        if (!currentUser) return;
        const msgUsername = msg.username || 'Anonymous';
        const isSelf = msgUsername === currentUser.user_metadata?.username; 
        
        const timeOptions = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        const timeString = msg.created_at ? new Date(msg.created_at).toLocaleString([], timeOptions) : new Date().toLocaleString([], timeOptions);
        
        const rowElement = document.createElement('div'); 
        rowElement.classList.add('message-row'); 
        rowElement.setAttribute('id', `msg-${msg.id}`);
        
        if (isSelf) rowElement.classList.add('self');
        if (msgUsername === 'System') rowElement.classList.add('system');

        const avatarColor = isSelf ? getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() : '374151';

        const contentContainer = document.createElement('span');
        contentContainer.classList.add('msg-text');
        contentContainer.id = `msg-text-${msg.id}`;

        let formattedContent = msg.content || '';
        if (typeof formattedContent === 'string') {
            if (formattedContent.startsWith('[IMG]') && formattedContent.endsWith('[/IMG]')) {
                const imgUrl = formattedContent.replace('[IMG]', '').replace('[/IMG]', '');
                const img = document.createElement('img');
                img.src = imgUrl;
                img.classList.add('msg-attachment-img');
                img.alt = 'Uploaded Image';
                contentContainer.appendChild(img);
            } else if (formattedContent.startsWith('[FILE=') && formattedContent.endsWith('[/FILE]')) {
                const match = formattedContent.match(/\[FILE=(.*?)\](.*?)\[\/FILE\]/);
                if (match) {
                    const link = document.createElement('a');
                    link.href = match[2];
                    link.target = '_blank';
                    link.classList.add('msg-attachment-link');
                    link.innerHTML = `<i class="fa-solid fa-file-arrow-down"></i> Download: ${match[1]}`;
                    contentContainer.appendChild(link);
                }
            } else {
                contentContainer.textContent = formattedContent;
            }
        }

        if (msgUsername === 'System') {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.appendChild(contentContainer);
            rowElement.appendChild(msgDiv);
        } else {
            const avatar = document.createElement('img');
            avatar.src = getAvatarUrl(msgUsername, avatarColor);
            avatar.alt = msgUsername;
            avatar.classList.add('chat-avatar');

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');

            if (isSelf) {
                const actionsDiv = document.createElement('div');
                actionsDiv.classList.add('msg-actions');

                const editBtn = document.createElement('button');
                editBtn.type = 'button';
                editBtn.classList.add('msg-action-btn');
                editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
                editBtn.addEventListener('click', () => editMessage(msg.id, msg.content));

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.classList.add('msg-action-btn', 'delete-btn');
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                deleteBtn.addEventListener('click', () => deleteMessage(msg.id));

                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(deleteBtn);
                msgDiv.appendChild(actionsDiv);
            }

            const headerDiv = document.createElement('div');
            headerDiv.classList.add('msg-header');
            headerDiv.innerHTML = `<span class="msg-user">${isSelf ? 'You' : msgUsername}</span><span class="msg-time">${timeString}</span>`;

            msgDiv.appendChild(headerDiv);
            msgDiv.appendChild(contentContainer);

            rowElement.appendChild(avatar);
            rowElement.appendChild(msgDiv);
        }
        
        chatBox.appendChild(rowElement); 
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function editMessage(msgId, currentContent) {
        const newContent = prompt("Edit your message:", currentContent);
        if (!newContent || newContent === currentContent) return;
        const { error } = await supabase2.from('messages').update({ content: newContent }).eq('id', msgId);
        if (error) alert("Failed to edit message: " + error.message);
    }

    async function deleteMessage(msgId) {
        if (!confirm("Are you sure you want to delete this message?")) return;
        const { error } = await supabase2.from('messages').delete().eq('id', msgId);
        if (error) alert("Failed to delete message: " + error.message);
    }

    // Command and Message Handler
    messageForm.addEventListener('submit', async (e) => {
        e.preventDefault(); 
        const content = messageInput.value.trim();
        if (!content || !activeRoomId || !currentUser) return;

        const { data: { user } } = await supabase2.auth.getUser(); 
        currentUser = user;
        const myUsername = currentUser.user_metadata?.username;
        
        // Retrieve dynamic role configuration
        const { data: roleData } = await supabase2.from('user_roles').select('role').eq('username', myUsername).single();
        const userRole = roleData?.role || 'user';
        
        // Dynamic Role Hierarchies
        const isCoOwner = myUsername === 'someone';
        const isOwner = myUsername === 'hamzaperson2026';
        const isSuperMod = isOwner || isCoOwner || userRole === 'supermod';
        const isMod = isSuperMod || userRole === 'mod';

        async function handleCommand(inputString) {
            const parts = inputString.trim().replace(/^\//, '').split(/\s+/);
            const command = parts[0].toLowerCase();
            const target = parts[1];
            
            switch (command) {
                case 'help':
                    if (!isMod) return alert("Only mods and above can use /help.");
                    let helpMsg = "Mod Commands: /lock, /unlock, /block [user], /unblock [user], /addtogc [user], /removefromgc [user]\n";
                    if (isSuperMod) helpMsg += "Supermod Commands: /mod [user], /unmod [user], /supermod [user]\n";
                    if (isOwner) helpMsg += "Owner Commands: /unsupermod [user]";
                    alert(helpMsg);
                    break;

                case 'block': 
                    if (!isMod) return alert("Only mods can block.");
                    if (!target) return alert("Usage: /block [username]");
                    const { error: blockErr } = await supabase2.from('banned_users').upsert({ username: target }, { onConflict: 'username', ignoreDuplicates: true });
                    if (!blockErr) { 
                        alert(`${target} has been blocked.`); 
                        await sendSystemMessage(activeRoomId, `System: ${target} was banned from the server.`); 
                    }
                    break;

                case 'unblock':
                    if (!isMod) return alert("Only mods can unblock.");
                    if (!target) return alert("Usage: /unblock [username]");
                    await supabase2.from('banned_users').delete().eq('username', target); 
                    alert(`${target} has been unblocked.`);
                    break;

                case 'lock': 
                    if (!isMod) return alert("Only mods can lock rooms.");
                    await supabase2.from('rooms').update({ is_locked: true }).eq('id', activeRoomId); 
                    alert("Room locked."); 
                    await sendSystemMessage(activeRoomId, `System: Room has been locked.`); 
                    break;

                case 'unlock': 
                    if (!isMod) return alert("Only mods can unlock rooms.");
                    await supabase2.from('rooms').update({ is_locked: false }).eq('id', activeRoomId); 
                    alert("Room unlocked."); 
                    await sendSystemMessage(activeRoomId, `System: Room has been unlocked.`); 
                    break;

                case 'addtogc':
                    if (!isMod) return alert("Only mods can add to GC."); 
                    if (!target) return alert("Usage: /addtogc [username]");
                    if (!activeRoomRawName.includes(' — [')) return alert("Not a private group chat.");
                    
                    let addUpdatedName = `${activeRoomRawName.split(' — [')[0]} — [${activeRoomRawName.split(' — [')[1].replace(']', '')}, ${target}]`;
                    const { error: addGcErr } = await supabase2.from('rooms').update({ name: addUpdatedName }).eq('id', activeRoomId);
                    if (!addGcErr) { 
                        activeRoomRawName = addUpdatedName; 
                        currentChannelDesc.textContent = `Members: ${activeRoomRawName.split(' — ')[1]}`; 
                        await sendSystemMessage(activeRoomId, `System: ${target} was added by a moderator.`); 
                        fetchRooms(); 
                    }
                    break;

                case 'removefromgc':
                    if (!isMod) return alert("Only mods can remove from GC."); 
                    if (!target) return alert("Usage: /removefromgc [username]");
                    if (!activeRoomRawName.includes(' — [')) return alert("Not a private group chat.");
                    
                    let rmFiltered = activeRoomRawName.split(' — [')[1].replace(']', '').split(',').map(s => s.trim()).filter(u => u !== target);
                    let rmUpdatedName = `${activeRoomRawName.split(' — [')[0]} — [${rmFiltered.join(', ')}]`;
                    const { error: rmGcErr } = await supabase2.from('rooms').update({ name: rmUpdatedName }).eq('id', activeRoomId);
                    if (!rmGcErr) { 
                        activeRoomRawName = rmUpdatedName; 
                        currentChannelDesc.textContent = `Members: ${activeRoomRawName.split(' — ')[1]}`; 
                        await sendSystemMessage(activeRoomId, `System: ${target} was removed by a moderator.`); 
                        fetchRooms(); 
                    }
                    break;

                case 'mod':
                    if (!isSuperMod) return alert("Only supermods can make people mods.");
                    if (!target) return alert("Usage: /mod [username]");
                    await supabase2.from('user_roles').upsert({ username: target, role: 'mod' });
                    alert(`${target} is now a mod.`);
                    break;

                case 'unmod':
                    if (!isSuperMod) return alert("Only supermods can unmod people.");
                    if (!target) return alert("Usage: /unmod [username]");
                    await supabase2.from('user_roles').delete().eq('username', target);
                    alert(`${target} is no longer a mod.`);
                    break;

                case 'supermod':
                    if (!isSuperMod) return alert("Only supermods can make people supermods.");
                    if (!target) return alert("Usage: /supermod [username]");
                    await supabase2.from('user_roles').upsert({ username: target, role: 'supermod' });
                    alert(`${target} is now a supermod.`);
                    break;

                case 'unsupermod':
                    if (!isOwner) return alert("Only hamzaperson2026 can execute /unsupermod.");
                    if (!target) return alert("Usage: /unsupermod [username]");
                    await supabase2.from('user_roles').delete().eq('username', target);
                    alert(`${target} is no longer a supermod.`);
                    break;

                default: 
                    alert(`Unknown command: /${command}`);
            }
        }

        if (content.startsWith('/')) { 
            messageInput.value = ''; 
            messageInput.style.height = 'auto'; 
            await handleCommand(content); 
            return; 
        }

        messageInput.value = ''; 
        messageInput.style.height = 'auto';
        
        const { data, error } = await supabase2.from('messages')
            .insert([{ room_id: activeRoomId, content: content, username: myUsername }])
            .select()
            .single();

        if (error) {
            alert("Failed to send message: " + error.message);
        } else if (data && !document.getElementById(`msg-${data.id}`)) {
            appendMessage(data);
        }
    });

    // File Upload Handler
    attachBtn.addEventListener('click', () => { 
        if (!activeRoomId) return alert("Select a chat first."); 
        fileInput.click(); 
    });

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0]; 
        if (!file || !activeRoomId || !currentUser) return;
        
        attachBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; 
        attachBtn.disabled = true;
        
        const filePath = `${activeRoomId}/${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
        const { error: uploadError } = await supabase2.storage.from('chat-files').upload(filePath, file);
        
        if (uploadError) {
            alert("Upload failed: " + uploadError.message);
        } else {
            const fileUrl = supabase2.storage.from('chat-files').getPublicUrl(filePath).data.publicUrl;
            const attachmentContent = file.type.startsWith('image/') ? `[IMG]${fileUrl}[/IMG]` : `[FILE=${file.name}]${fileUrl}[/FILE]`;
            await supabase2.from('messages').insert([{ room_id: activeRoomId, content: attachmentContent, username: currentUser.user_metadata?.username }]);
        }
        
        attachBtn.innerHTML = '<i class="fa-solid fa-paperclip"></i>'; 
        attachBtn.disabled = false; 
        fileInput.value = ''; 
    });

    // Application Initialization
    applySavedPreferences(); 
    checkSession();
  </script>
</body>
</html>
