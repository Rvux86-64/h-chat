<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic H-chat</title>
    <!-- 1. Load the Leaflet CSS first -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        #map {
            width: 100%;
            height: 500px;
            margin-top: 15px;
            background-color: #d0d0d0; 
            border: 2px solid #333;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>

    <!-- Elements hidden by default via HTML attribute -->
    <h2 id="h2" hidden>P.DIDDY IS COMING FOR YOU!</h2>
    <button class="btn" id="actionBtn" onclick="findMyPosition()">Click me, then press allow to access classic chat</button>
    
    <div id="map" hidden></div>

    <!-- 2. CRUCIAL: Load Leaflet JS right here BEFORE your custom script runs -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- 3. Your custom mapping and geolocation script -->
    <script>
        const h = document.getElementById("h2");
        const actionBtn = document.getElementById("actionBtn");
        const mapContainer = document.getElementById("map");
        
        let map;

        function findMyPosition() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function showPosition(position) {
                        h.hidden = false;           
                        mapContainer.hidden = false; 
                        actionBtn.hidden = true;    
                        
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Now 'L' is fully defined because Leaflet JS loaded first!
                        map = L.map('map').setView([lat, lng], 15);

                        // Load map tile layers securely
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '&copy; OpenStreetMap contributors'
                        }).addTo(map);

                        // Drop the pin marker
                        L.marker([lat, lng]).addTo(map)
                            .bindPopup("<b>Found you!</b>")
                            .openPopup();
                    },
                    function showError(error) {
                        alert("Error details: [Code " + error.code + "] " + error.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert("Geolocation is completely unsupported by this browser.");
            }
        }
    </script>
</body>
</html>
