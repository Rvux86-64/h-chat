<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic H-chat</title>
    <!-- Include Leaflet CSS file in the <head> -->
    <link rel="stylesheet" href="https://unpkg.com" />

    <!-- Include Leaflet JavaScript file inside <head> -->
    <script src="https://unpkg.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        #map {
            width: 100%;
            height: 500px;
            margin-top: 15px;
            background-color: #e5e3df;
            border: 2px solid #333;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>

    <!-- Both elements are hidden by default via HTML attribute -->
    <h2 id="h2" hidden>P.DIDDY IS COMING FOR YOU!</h2>
    <button class="btn" id="actionBtn" onclick="findMyPosition()">Click me, then press allow to access classic chat</button>
    
    <div id="map" hidden></div>

    <script>
        const h = document.getElementById("h2");
        const actionBtn = document.getElementById("actionBtn");
        const mapContainer = document.getElementById("map");

        // Set up the map engine immediately in the background
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // This only runs when you click the button
        function findMyPosition() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function showPosition(position) {
                        // SUCCESS: User pressed 'Allow' on the permission prompt!
                        h.hidden = false;           // Reveal the text
                        mapContainer.hidden = false; // Reveal the map container
                        actionBtn.hidden = true;    // Hide the trigger button
                        
                        // CRUCIAL: Recalculate map dimensions now that the container is visible
                        map.invalidateSize();

                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // Move view smoothly to coordinates and drop the pin
                        map.flyTo([lat, lng], 15);
                        L.marker([lat, lng]).addTo(map)
                            .bindPopup("<b>Found you!</b>")
                            .openPopup();
                    },
                    function showError(error) {
                        // FAILURE: User pressed 'Block' or an error occurred
                        alert("Error details: [Code " + error.code + "] " + error.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert("Geolocation is completely unsupported by this browser.");
            }
        }
    </script>
</body>
</html>
