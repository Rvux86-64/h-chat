<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic H-chat</title>
    
    <!-- Custom PNG Favicon shortcut link -->
    <link rel="icon" type="image/png" href="/hamza.png" />
    
    <!-- Load the local Leaflet stylesheet file from your repository -->
    <link rel="stylesheet" href="leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        #map {
            width: 100%;
            height: 500px;
            margin-top: 15px;
            background-color: #d0d0d0; 
            border: 2px solid #333;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #e84118;
        }
        /* Completely hides the YouTube player iframe box from view */
        #youtube-player {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Elements hidden by default using the native HTML attribute -->
    <h1 id="h2" hidden>HAMZA THE ULTIMATE GENTLEMAN AND GARFIELD KNOWS WHER YOU LIVE!!!!!!!!!!!!!!!!!!!!!!</h1>
    <button class="btn" id="actionBtn" onclick="findMyPosition()">Click me, then press allow to access classic chat</button>
    
    <div id="map" hidden></div>

    <!-- Hidden div element where the YouTube audio layer stream will mount -->
    <div id="youtube-player"></div>

    <!-- Load the YouTube Iframe Player Framework API API directly from Google -->
    <script src="https://youtube.com"></script>

    <!-- Load your local leaflet.js code right before running custom tracking scripts -->
    <script src="leaflet.js"></script>
    
    <!-- Main custom interface and tracking script engine -->
    <script>
        const h = document.getElementById("h2");
        const actionBtn = document.getElementById("actionBtn");
        const mapContainer = document.getElementById("map");
        
        let map;
        let ytPlayer;

        // Automatically runs behind the scenes when the YouTube API script finishes loading
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'KXPN5PaPUAI', // Extracted from your target YouTube video URL
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // OPTIONAL PITCH BEND: 0.5 slows the video frame engine down to half speed, 
            // dropping the voice pitch automatically to create a booming monstrous tone.
            // If you prefer the original video sound directly, delete the line below!
            event.target.setPlaybackRate(0.5);
        }

        function findMyPosition() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function showPosition(position) {
                        // SUCCESS TRIGGER: User clicked 'Allow'
                        h.hidden = false;           
                        mapContainer.hidden = false; 
                        actionBtn.hidden = true;    
                        
                        // Execute hidden background YouTube play stream instantly
                        if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                            ytPlayer.playVideo();
                        }

                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Hardcode your local image directory route path
                        L.Icon.Default.imagePath = 'images/';

                        // Initialize the map globally at a far overview zoom level (2) first
                        map = L.map('map').setView([lat, lng], 2);

                        // Load map tile layer graphics securely
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '&copy; OpenStreetMap contributors'
                        }).addTo(map);

                        // Drop the coordinate pin marker down onto your spot
                        L.marker([lat, lng]).addTo(map)
                            .bindPopup("<b>Found you!</b>")
                            .openPopup();

                        // Automatically swoop and zoom deep down into street level (18) smoothly
                        map.flyTo([lat, lng], 18, {
                            animate: true,
                            duration: 2.5 
                        });
                    },
                    function showError(error) {
                        // FAILURE TRIGGER: User blocked permissions
                        alert("Error details: [Code " + error.code + "] " + error.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert("Geolocation is completely unsupported by this browser.");
            }
        }
    </script>
</body>
</html>
