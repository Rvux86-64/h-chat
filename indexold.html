<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic H-chat</title>
    <!-- Leaflet CSS (Fixed CDN path) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        #map {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>

    <h2>P.DIDDY IS COMING FOR YOU!</h2>
    <div id="map"></div>

    <!-- Leaflet JS (Fixed CDN path) -->
    <script src="https://unpkg.com"></script>
    <script>
        // Check if browser supports Geolocation
        if (navigator.geolocation) {
            // Added enableHighAccuracy to help it find mobile GPS devices faster
            navigator.geolocation.getCurrentPosition(showPosition, showError, { enableHighAccuracy: true });
        } else {
            alert("Geolocation is not supported by this browser.");
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            // Initialize Leaflet map centered at user coordinates
            const map = L.map('map').setView([lat, lng], 15);

            // Add OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Add a marker at user's location
            L.marker([lat, lng]).addTo(map)
                .bindPopup("You are here!")
                .openPopup();
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    alert("User denied the request for Geolocation. Please allow location permissions.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("Location information is unavailable.");
                    break;
                case error.TIMEOUT:
                    alert("The request to get user location timed out.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("An unknown error occurred.");
                    break;
            }
        }
    </script>
</body>
</html>
